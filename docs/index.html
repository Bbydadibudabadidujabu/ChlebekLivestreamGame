<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klaskanie 🍞</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
body{position:relative;background:url("stars.jpg") center/cover no-repeat}
body:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.22);pointer-events:none;z-index:1}
.stars{position:absolute;inset:-5%;background:url("stars.jpg") center/cover;opacity:.45;animation:stars 30s linear infinite;z-index:0}
@keyframes stars{0%{transform:scale(1)}50%{transform:scale(1.06) translate(-1%,-1%)}100%{transform:scale(1)}}
#game{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center}
#players{position:absolute;width:min(76vw,760px);height:min(76vw,760px);left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
.player{position:absolute;width:78px;height:78px;border:4px solid #fff;border-radius:50%;overflow:visible;background:#222;box-shadow:0 0 12px #fff8,0 0 28px #fff4;animation:appear .35s ease-out}
.player img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.name{position:absolute;left:50%;top:82px;transform:translateX(-50%);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;font-size:14px;font-weight:700;text-shadow:0 2px 5px #000; text-align:center}
@keyframes appear{0%{transform:scale(0);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
#bread{position:relative;z-index:20;width:230px;image-rendering:pixelated;filter:drop-shadow(0 0 8px #fff6) drop-shadow(0 0 30px #ffc85055)}
#bread.clap{animation:clap .65s ease-out}
@keyframes clap{0%{transform:scale(1) rotate(0)}15%{transform:scale(1.35) rotate(-10deg);filter:drop-shadow(0 0 15px #fff) drop-shadow(0 0 45px #ffd700)}30%{transform:scale(1.15) rotate(10deg)}50%{transform:scale(1.3) rotate(-7deg)}70%{transform:scale(1.08) rotate(4deg)}100%{transform:scale(1) rotate(0)}}
#round,#tickets{position:absolute;z-index:30;color:#fff;font-weight:700;text-shadow:0 2px 5px #000}
#round{top:22px;left:50%;transform:translateX(-50%);font-size:22px}
#tickets{bottom:22px;left:50%;transform:translateX(-50%);font-size:20px}
#status{position:absolute;right:20px;top:20px;z-index:30;padding:8px 12px;border-radius:999px;background:#0008;color:#aaa;font-size:13px}
#status.connected{color:#9cffb2}
#winner{position:absolute;inset:0;z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.76)}
#winner.show{display:flex;animation:fade .35s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
#winnerTitle{font-size:70px;font-weight:900;color:#fff;text-shadow:0 0 12px #fff,0 0 35px gold,0 0 65px gold}
#winnerAvatar{width:180px;height:180px;border-radius:50%;object-fit:cover;border:8px solid #fff;box-shadow:0 0 25px #fff,0 0 70px gold;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
#winnerName{margin-top:24px;color:#fff;font-size:45px;font-weight:800;text-shadow:0 0 10px #000}
#winnerHandle{margin-top:8px;color:#ddd;font-size:24px}
#winnerMethod{margin-top:10px;color:#ffd95a;font-size:20px}
@media(max-width:700px){#bread{width:170px}.player{width:58px;height:58px}.name{top:62px;font-size:11px}#winnerTitle{font-size:46px}#winnerAvatar{width:130px;height:130px}#winnerName{font-size:30px}}
</style>
</head>
<body>
<div class="stars"></div>
<div id="game">
  <div id="players"></div>
  <img id="bread" src="bread.webp" alt="Bread">
</div>
<div id="round">ROUND 1</div>
<div id="tickets">🎟️ 0 entries</div>
<div id="status">Connecting...</div>
<div id="winner">
  <div id="winnerTitle">🏆 WINNER!</div>
  <img id="winnerAvatar" alt="">
  <div id="winnerName"></div>
  <div id="winnerHandle"></div>
  <div id="winnerMethod"></div>
</div>
<script>
const CONFIG = {
  // After deploying the Node server, put its HTTPS URL here.
  // Example: https://klaskanie-server.onrender.com
  API_BASE: "https://github.com/Bbydadibudabadidujabu/ChlebekLivestreamGame"
};

const playersEl=document.getElementById("players");
const bread=document.getElementById("bread");
const ticketsEl=document.getElementById("tickets");
const roundEl=document.getElementById("round");
const statusEl=document.getElementById("status");
const winnerEl=document.getElementById("winner");
const winnerAvatar=document.getElementById("winnerAvatar");
const winnerName=document.getElementById("winnerName");
const winnerHandle=document.getElementById("winnerHandle");
const winnerMethod=document.getElementById("winnerMethod");
const known=new Map();

function wsUrl(){
  return CONFIG.API_BASE.replace(/^http/,"ws") + "/ws";
}
function fallbackAvatar(){
  return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#333"/><text x="50" y="58" text-anchor="middle" fill="white" font-size="42">?</text></svg>'
  );
}
function positionPlayers(){
  const nodes=[...playersEl.children];
  const n=nodes.length;
  if(!n)return;
  const radius=Math.min(playersEl.clientWidth,playersEl.clientHeight)*.37;
  nodes.forEach((el,i)=>{
    const a=i/n*Math.PI*2-Math.PI/2;
    el.style.left=`calc(50% + ${Math.cos(a)*radius}px - 39px)`;
    el.style.top=`calc(50% + ${Math.sin(a)*radius}px - 39px)`;
  });
}
function addPlayer(p){
  if(!p || !p.username || known.has(p.username))return;
  const el=document.createElement("div"); el.className="player";
  const img=document.createElement("img"); img.src=p.profilePicture||fallbackAvatar();
  img.onerror=()=>{img.src=fallbackAvatar()};
  const name=document.createElement("div"); name.className="name"; name.textContent=p.nickname||p.username;
  el.append(img,name); playersEl.appendChild(el); known.set(p.username,el); positionPlayers();
}
function resetPlayers(){
  playersEl.innerHTML=""; known.clear();
}
function clap(){
  bread.classList.remove("clap"); void bread.offsetWidth; bread.classList.add("clap");
}
function scream(n){
  const a=new Audio(`sounds/scream${n}.mp3`);
  a.volume=1;
  a.play().catch(()=>{});
}
function showWinner(w){
  winnerAvatar.src=w.profilePicture||fallbackAvatar();
  winnerAvatar.onerror=()=>winnerAvatar.src=fallbackAvatar();
  winnerName.textContent=w.nickname||w.username;
  winnerHandle.textContent="@"+(w.username||"unknown")+" won!";
  winnerMethod.textContent=w.lastCommand==="!Krzyczenie"?"😱 KRZYCZENIE":"👏 KLASKANIE";
  winnerEl.classList.add("show");
}
function hideWinner(){winnerEl.classList.remove("show")}
function connect(){
  if(CONFIG.API_BASE.includes("YOUR-SERVER")){
    statusEl.textContent="Set API_BASE";
    return;
  }
  const ws=new WebSocket(wsUrl());
  ws.onopen=()=>{statusEl.textContent="Connected";statusEl.classList.add("connected")};
  ws.onclose=()=>{statusEl.textContent="Reconnecting...";statusEl.classList.remove("connected");setTimeout(connect,2000)};
  ws.onerror=()=>ws.close();
  ws.onmessage=e=>{
    let d; try{d=JSON.parse(e.data)}catch{return}
    if(d.type==="state"){
      roundEl.textContent=`ROUND ${d.round}`;
      ticketsEl.textContent=`🎟️ ${d.totalTickets} entries`;
      d.players.forEach(addPlayer);
      if(d.winner)showWinner(d.winner); else hideWinner();
    }
    if(d.type==="player"){addPlayer(d.player);ticketsEl.textContent=`🎟️ ${d.totalTickets} entries`}
    if(d.type==="klaskanie")clap();
    if(d.type==="krzyczenie")scream(d.sound);
    if(d.type==="winner")showWinner(d.winner);
    if(d.type==="newRound"){
      hideWinner();resetPlayers();roundEl.textContent=`ROUND ${d.round}`;ticketsEl.textContent="🎟️ 0 entries";
    }
  };
}
window.addEventListener("resize",positionPlayers);
connect();
</script>
</body>
</html>
